name: Build RunPod image

# Manual trigger ONLY. This builds a large image (PyTorch + CUDA libs +
# Sionna RT/Mitsuba/Dr.Jit); it must never run automatically on push, pull
# request, or a schedule.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Docker tag to build and push (e.g. v1, v2). Must NOT be "latest".
        required: true
        default: "v1"

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build, CPU smoke test, push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify required files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            Dockerfile.runpod \
            .dockerignore \
            docker/runpod-start.sh \
            docker/smoke_test.py \
            docker/requirements-runpod.txt \
            docker/constraints.txt
          do
            if [ ! -f "$f" ]; then
              echo "::error::required file missing: $f"
              missing=1
            else
              echo "found: $f"
            fi
          done
          if [ "$missing" != "0" ]; then
            exit 1
          fi

      - name: Validate image_tag and compute image name
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${IMAGE_TAG_INPUT}"
          if [ -z "${TAG}" ]; then
            echo "::error::image_tag is empty"
            exit 1
          fi
          if [ "${TAG}" = "latest" ]; then
            echo "::error::image_tag must not be 'latest'"
            exit 1
          fi
          # Valid Docker tag: 1-128 chars, [A-Za-z0-9_.-], cannot start with '.' or '-'.
          if ! [[ "${TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag '${TAG}' is not a valid Docker tag"
            exit 1
          fi
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::repository variable DOCKERHUB_USERNAME is not set"
            exit 1
          fi
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/mmimo-sleep-runpod:${TAG}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Resolved image: ${IMAGE}"

      - name: Diagnostics (disk space + docker version)
        run: |
          echo "---- df -h ----"
          df -h
          echo "---- docker version ----"
          docker version

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load into runner, do not push yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.runpod
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run CPU smoke test (must pass before any push)
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /opt/venv/bin/python \
            "${{ env.IMAGE }}" \
            /opt/smoke_test.py --mode cpu

      - name: Push image to Docker Hub
        run: |
          set -euo pipefail
          docker push "${{ env.IMAGE }}"

      - name: Verify pushed image is linux/amd64
        id: verify
        run: |
          set -euo pipefail
          OUTPUT="$(docker buildx imagetools inspect "${{ env.IMAGE }}")"
          echo "${OUTPUT}"
          if ! echo "${OUTPUT}" | grep -q "linux/amd64"; then
            echo "::error::pushed image manifest does not report a linux/amd64 platform"
            exit 1
          fi
          DIGEST="$(echo "${OUTPUT}" | awk '/^Digest:/{print $2; exit}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "### RunPod image build: success"
            echo ""
            echo "- **Image**: \`${{ env.IMAGE }}\`"
            echo "- **Digest**: \`${{ steps.verify.outputs.digest }}\`"
            echo "- **Platform**: linux/amd64 (verified via \`docker buildx imagetools inspect\`)"
            echo "- **CPU/import smoke test**: passed (\`--mode cpu\`)"
            echo ""
            echo "> GPU acceptance (\`--mode gpu\`) has NOT been run by this workflow." \
                 "It must be run manually on an actual RunPod GPU pod before relying on" \
                 "this tag for production workloads."
          } >> "$GITHUB_STEP_SUMMARY"
