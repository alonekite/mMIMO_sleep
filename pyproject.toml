[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmimo-sleep"
version = "0.1.0"
description = "PMI-aware link-budget prediction for half-panel Massive MIMO sleep"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<2",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
rt = [
    "sionna==1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
